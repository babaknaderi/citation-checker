name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What limitation or workflow problem should be solved?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed behavior
          description: Describe the desired outcome without including private manuscript content.
      validations:
          required: true
    - type: dropdown
      id: hosts
      attributes:
          label: Affected host
          multiple: true
          options:
              - GitHub Copilot CLI
              - Claude Code
              - Both
              - Host-independent
      validations:
          required: true
